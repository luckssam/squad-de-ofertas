name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: |
          python -m unittest discover -s tests -v

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar ruff
        run: pip install ruff

      - name: Verificar código
        run: ruff check .

  check-secrets:
    name: Verificar segredos não commitados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar .env no histórico
        run: |
          if git log --all --full-history -- .env | grep -q "."; then
            echo "⚠️ AVISO: .env encontrado no histórico do git!"
            exit 1
          else
            echo "✅ .env não está no histórico"
          fi

      - name: Verificar chaves hardcoded
        run: |
          # Busca padrões de chaves comuns no código (exceto .env.example)
          if grep -r -E "(SERPAPI_KEY|MELI_CLIENT_SECRET|AMAZON_SECRET_KEY|OPENAI_API_KEY)\s*=\s*['\"][^'\"]{10,}" --include="*.py" --include="*.js" --include="*.html" --include="*.md" --exclude=".env.example" .; then
            echo "⚠️ Possível chave hardcoded encontrada!"
            exit 1
          else
            echo "✅ Nenhuma chave hardcoded detectada"
          fi

  build-docker:
    name: Build Docker (verifica se builda)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imagem
        run: |
          docker build -t squad-ofertas:test .